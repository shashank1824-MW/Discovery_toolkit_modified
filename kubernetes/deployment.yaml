apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-toolkit-backend
  namespace: support-toolkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-toolkit-backend
  template:
    metadata:
      labels:
        app: support-toolkit-backend
    spec:
      containers:
        - name: backend
          image: support-toolkit-backend:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
